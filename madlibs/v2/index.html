    <main>

        <section id="welcome-1" class="showing welcome-1">
            <header>
                <h1>WELCOME</h1>
            </header>

            <button id="begin">Click to Begin</button>
        </section>

        <section id="choose-2" class="hidden">
            <header>
                <h1>PLEASE CHOOSE CAREFULLY</h1>
            </header>

                <form>
                    <label for="nouns">Choose a Noun</label>
                    <select id="nouns">
                        <option value="curse">Curse</option>
                        <option value="affliction">Affliction</option>
                        <option value="hex">Hex</option>
                        <option value="misfortune">Misfortune</option>
                    </select>

                    <label for="chooseadj">Choose an Adjective</label>
                    <select id="chooseadj">
                        <option value="spooky">Spooky</option>
                        <option value="haunted">Haunted</option>
                        <option value="catastrophic">Catastrophic</option>
                        <option value="terrifying">Terrifying</option>
                    </select>

                    <label for="location">Choose a Location</label>
                    <select id="location">
                        <option value="mansion">Mansion</option>
                        <option value="forest">Forest</option>
                        <option value="cabin">Cabin</option>
                    </select>
                </form>

            <a href="#" id="next">NEXT</a>
        </section>

        <section id="type-3" class="hidden">
            <header>
                <h1>PLEASE FILL IN</h1>
            </header>

                <form>
                    <!-- <label for="nouns">1. Plural Noun:</label>
                    <input type="text" id"nouns">

                    <label for="spookyadj">2. Spooky Adjective:</label>
                    <input type="text" id"spookyadj"> -->

                    <label for="emotion">1. Positive Emotion</label>
                    <input type="text" id="emotion">

                    <label for="level">2. Level of Difficulty</label>
                    <input type="text" id="level">

                    <label for="adj">3. Adjective</label>
                    <input type="text" id="adj">

                    <label for="noun">4. Noun</label>
                    <input type="text" id="noun">

                    <label for="fav">5. Favorite Childhood Location</label>
                    <input type="text" id="fav">
                </form>
                    <!-- <div id="error"></div> -->
            <button id="pgnext">NEXT</button>
        </section>

        <section id="type-4" class="hidden">
            <header>
                <h1>PLEASE FILL IN</h1>
            </header>

                <form>
                    <label for="num">6. Number</label>
                    <input type="text" id="num">

                    <label for="num2">7. Another Number</label>
                    <input type="text" id="num2">

                    <label for="ocean">8. Aquatic Animal</label>
                    <input type="text" id="ocean">

                    <label for="ocean2">9. Another Aquatic Animal</label>
                    <input type="text" id="ocean2">

                    <label for="body">10. A Body Part</label>
                    <input type="text" id="body">
                </form>

                <button id="finalpg">GO TO STORY</button>
            
            <!-- <div id="error"></div> -->
        </section>

        <section id="story-5" class="hidden">
            <header>
                <!-- <h1>The <span>(nouns)</span> of the (location)</span></h1> -->

                <a href="#" id="return">Return to Start</a>
                 <!-- <button id="return">Back to start</button> -->
            </header>

            <div id="product">
                <!-- <img src="images/comicdone.png" alt="mablibs comic">

                <p class="d1">I'm not too (emotion) about this next story. My supervisors told me it was (difficulty level), even for them. Even worse, I'm stuck with my (adj) coworker too...</p>

                <p class="d2">UGH! <br>
                This place smells like (noun)!</p>

                <p class="d3">Hmm... I kinda like it. Reminds me of my (childhood location).</p>

                <p class="d4">We've been walking around for (#) hour(s) and still haven't found a single monster. I'm starting to think this was a fluke.</p>

                <p class="d5">(#) Hours Later</p>

                <p class="d6">Oh $#@%! Is that a (ocean animal)?!</p>

                <p class="d7">No, Looks more like a (ocean animal).</p>

                <p class="d8">I can't believe he lost his (body part)...</p> -->
            </div>
        </section>

    </main>

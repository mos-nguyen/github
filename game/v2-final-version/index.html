<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game On! - BrawlFee</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet"> 
    <!-- font-family: "Pixelify Sans", sans-serif; -->

    <link href="https://fonts.googleapis.com/css2?family=Rancho&display=swap" rel="stylesheet">
    <!-- font-family: "Rancho", cursive; -->

    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <section id="ol-start" >
        <article>
            <header>
                <img src="images/logo.svg" alt="bell logo for brawlfee">
            </header>

            <div id="btn">
                <button class="play">Let's Play!</button>
                <!-- <button>Rules</button>
                <button>Settings</button> -->
                <a href="../../index.html">Portal
                    <!-- <button class="portal">Portal</button> -->
                </a>
                
            </div>
        </article>
    </section>

    <section id="afterplay" class="hidden">
        <img id=logo src="images/logo.svg" alt="bell logo for brawlfee">

        <section id="battle">
        <!-- ---------------Player 1---------------------- -->
            <div>
                <div id="player1">
                    <p>Player 1</p>

                    <div class="health">
                        <div id="healthbar0"><div></div></div><p id="playerhealth0">100%</p>
                    </div>
                </div>

                <img src="images/p1.svg" alt="player 1's character" id="char1">
            </div>

<!-- ---------------Player 2---------------------- -->
            <div>
                <div id="player2">
                    <p>Player 2</p>

                    <div class="health">
                        <div id="healthbar1"><div></div></div><p id="playerhealth1">100%</p>
                    </div>
                </div>

                <img src="images/p2.svg" alt="player 2's character" id="char2">
            </div>
        </section>
<!-- ---------------PLAYERS CHOICES---------------------- -->
        <section id="choice">
            <div id="messages">
                <p class="narrate">Player 1 is up! What will your character do?</p>
            </div>
            
            <div id="quad">
                <button id="attack">Attack</button>
                <button id="heal">Heal</button>
                <!-- <button id="special">Special Attack</button> -->
                <button id="giveup">Give Up</button>
            </div>

        </section>
    </section>

</body>

</html>
